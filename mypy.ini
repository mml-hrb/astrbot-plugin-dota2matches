; ============================================================
; mypy 配置 —— 静态类型检查
; ============================================================
;
; ⚠️ **跑法很讲究，从插件目录内直接跑会失败**。
;
;   本插件的模块之间大量使用相对导入（`from .dota_api import …`），
;   而 mypy 要解析相对导入，必须知道「这个文件属于哪个包」。
;   插件目录**故意没有** `__init__.py`（AstrBot 的加载器是把插件目录
;   直接当包加载的；自己加一个 `__init__.py` 反而会改变导入语义），
;   所以只能靠 `explicit_package_bases` 把「包基准目录」指到**父目录**。
;
;   ✅ 对：cd 到父目录，再把插件目录当包名传进去
;        mypy --config-file astrbot_plugin_dota2/mypy.ini \
;             --explicit-package-bases astrbot_plugin_dota2
;   ❌ 错：在插件目录内跑 `mypy .`
;        → dota_chat.py:70: error: No parent module -- cannot perform relative import
;          （cwd 成了包基准，每个源文件都成了顶层模块，`from .x` 无处可归）
;
;   注意 `--mypy-path` **不是 mypy 的选项**（会报 unrecognized arguments）；
;   与之相关的 ini 键叫 `mypy_path`，它只影响导入搜索路径，**改不了包基准**，
;   所以解决不了上面的 "No parent module"。唯一可靠的办法就是上面的跑法。
;
; 本机实测（mypy 2.4.0，17 个源文件）：
;   Success: no issues found in 17 source files

[mypy]
python_version = 3.10

; 让「父目录 + 包名」这种调用方式能正确解析包内的相对导入
explicit_package_bases = True

; AstrBot 本体（`astrbot.*`）与第三方 SDK 只在宿主环境里存在，
; 本仓库不 vendored，因此必须忽略缺失导入，否则满屏 import-untyped。
; （实测：不忽略时 17 个文件里几乎每个都报 astrbot 找不到）
ignore_missing_imports = True

; 不把类型检查的噪音当成错误挡住 CI，但保留可读的报错行号
show_error_codes = True
pretty = True
