name: 从 Gitee 同步

# Gitee 是本仓库的主仓库（origin），GitHub 侧是只读镜像。
# 每次 Gitee 有更新，本 workflow 就会把提交（含标签）拉到 GitHub 保持一致。
#
# 首次启用：本地提交本文件后，先手动 push 一次到 GitHub
#   git push github main
# 否则 workflow 不会存在于 GitHub 上，也就无从触发。

on:
  schedule:
    # 每 10 分钟检查一次。GitHub 的 cron 是 UTC 时间，10 分钟间隔够用且不浪费配额。
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手动触发，调试用

permissions:
  contents: write # 推送需要

concurrency:
  # 同一分支只允许一个同步任务在跑，避免定时与手动触发撞车互相覆盖
  group: sync-from-gitee
  cancel-in-progress: false

jobs:
  sync:
    name: 拉取 Gitee 最新提交
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（完整历史）
        uses: actions/checkout@v4
        with:
          # 必须拉全历史与全部分支/标签，否则下面的 force push 会丢东西
          fetch-depth: 0
          ref: main

      - name: 配置 Gitee 远程
        run: git remote add gitee https://gitee.com/Mml3289469099/astrbot-plugin-dota2matches.git

      - name: 配置 Gitee 访问凭据
        # Gitee 仓库是公开的，默认不需要任何凭据。
        # 若将来转私有，在仓库 Secrets 里加一个 GITEE_TOKEN（Gitee 的私人令牌，勾只读权限即可）。
        # 绝不能在 secret 缺失时硬塞认证头——那会生成一个无效 token 把公开拉取也搞挂。
        if: ${{ secrets.GITEE_TOKEN != '' }}
        run: |
          git config http.https://gitee.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ secrets.GITEE_TOKEN }}' | base64 -w0)"

      - name: 拉取 Gitee 提交与标签
        run: |
          git fetch gitee '+refs/heads/*:refs/remotes/gitee/*' --tags --force --prune

      - name: 同步主分支到 GitHub
        run: |
          # 镜像语义：GitHub 无独立改动，一律以 Gitee 为准。
          # --force 是有意的——GitHub 侧只读，不接受 Gitee 改写历史的情况。
          git push github '+refs/remotes/gitee/main:refs/heads/main' --force

      - name: 同步其他分支与标签
        if: always()
        continue-on-error: true
        run: |
          # 非主分支同步失败不应让整个任务变红（可能有分支只存在于本地）
          git push github 'refs/remotes/gitee/*:refs/heads/*' --force
          git push github --tags --force

      - name: 汇总结果
        if: always()
        run: |
          echo "### 同步完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gitee 侧 HEAD：$(git rev-parse --short gitee/main)" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub 侧 HEAD：$(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "最近提交：" >> "$GITHUB_STEP_SUMMARY"
          git log --oneline -10 gitee/main >> "$GITHUB_STEP_SUMMARY"
