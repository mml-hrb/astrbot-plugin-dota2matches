name: astrbot_plugin_dota2 # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: Dota2 数据查询助手 # 用于展示的名字（需要 AstrBot >= v4.5.0）
desc: 基于 STRATZ + OpenDota 双数据源的 Dota2 战绩查询与 AI 分析助手。默认以 STRATZ 为主数据源、OpenDota 为后备，主源失效时自动降级。支持绑定玩家（昵称 / 32 位 account_id / 64 位 SteamID）、战绩查询、AI 复盘分析近期打法风格、单场比赛深度复盘（走势、质量评估、十人点评）；比赛已解析时会把解析产物里的可用维度尽量喂入提示词（逐分钟经济/经验曲线、经济与经验来源分解、输出与承伤构成、英雄间伤害矩阵、视野与守卫、团战逐人贡献、技能加点与施放、道具使用、中立物品、建筑存活、翻盘/碾压指标、阵亡与复活耗时等），避免「数据拿到了却没进报告」。单场复盘遇到未解析的局会自动催解析并每分钟检查一次，最多等 10 分钟；等满仍未解析时不再干等，自动降级用现有数据出一份「未解析版」报告（如实标注数据完整度，不拿基础数据冒充完整解析），等解析好后再发一次即可拿到完整版。比赛监听改为轻量播报：比赛结束后只读取胜负与 KDA，结合该玩家近期战绩生成一段 2~4 句的短评推送，不再自动输出完整战报、不再 @ 订阅人；因为不依赖录像解析，推送也不必再等解析完成（要看完整复盘仍可用单场复盘指令）。自然语言入口默认要求消息里带唤醒词「dota2助手」，未命中时完全不介入事件传播，不影响其他插件与默认大模型；命中唤醒词但没识别出指令时，会带着本会话的监听名单、绑定关系、监听推送过的比赛（含每场的开赛时间）、相关玩家的近期战绩、以及每场比赛的本地时间与相对日期让模型接着聊，因此「昨天谁打得好」「昨天群里开黑谁最牛逼」这类带时效与开黑的问题也能答：一天按凌晨 4 点分界（玩家普遍熬夜，0:00~3:59 打的局算前一天，因此「昨晚」包含凌晨那几局），识别到时间词（昨天/上周/9月14日）后统计口径会自动收窄到那个时间段，并把各人战绩按比赛 ID 归并出「同场局」——同一场里出现两位以上本会话成员即判定为群里开黑，是唯一能直接横向比高下的依据（缺组队字段的场次一律按「未知」处理，绝不当作单排）。AI 报告可选用插件专用的 OpenAI 兼容 API Key，与 AstrBot 全局模型解耦。新增「查轮椅」指令（/d2 轮椅，别名 版本英雄 / 强势英雄 / 胜率榜 / 版本答案）：基于 OpenDota 公开的 /heroStats 聚合接口（最近 7 天滚动窗口、全分段，无需 Key、不消耗解析额度）给出当前版本胜率最高的英雄榜单，每个英雄附官方定位（核心 / 辅助 / 三号位）、主属性、样本量与近 3 天走势；榜单由「胜率最高」「热门里最横的」「悠着点」三段组成，并按样本中位数自适应设置门槛，把只有几百场样本的偶然高胜率英雄挡在榜外。支持位置筛选（/d2 轮椅 辅助）与个人化推荐（/d2 轮椅 我 / /d2 轮椅 <昵称>）：会把版本榜单与该玩家的英雄池（熟练度）和近期逐场表现（KDA / GPM / 分路分布）一起交给 AI，从版本强势英雄里挑出他现在就能上分的，并强制「只从榜单内挑、不编造榜单外英雄与近似数字」；AI 不可用时退化为纯数据交叉的规则版推荐（已经在玩 / 会玩但没动 / 没玩过但定位相近）。统计窗口是滚动的最近 7 天而非严格按补丁切分，若当前补丁发布不足 7 天会明确提示榜单里仍混有上个版本的样本，不假装是纯新版本数据。自然语言入口里问「轮椅」时也会认出「给谁推荐」：「天鸽的轮椅有哪些」「钢板这版本玩什么上分英雄」「帮我推荐几个轮椅」都行 —— 本会话里绑定过或正在监听的名字先做精确匹配（这些名字是真查出来的，比正则可靠），没对上再按句子结构抽；模型分类给出的位置词（如「辅助」）会被挡掉，不会拿它去搜账号。只问榜单、没提人时不会额外拉取个人数据或多调一次模型。自然语言兜底对话新增「多轮工具调用」：一句话里要好几件事时（例如「钢板最近打得怎么样？顺便给他推荐几个轮椅英雄上分」——既要个人战绩又要版本榜的个人适配），插件不再只把数据一次性塞给模型，而是把查战绩 / 查英雄池 / 查玩家资料 / 查当前版本强势英雄榜 / 在榜单里结合英雄池挑英雄 / 列本会话可查玩家做成**只读工具**，让模型自己决定调几次、调哪些（一轮里能连调多个），查完再一起回答 —— 因为意图分类一次只能给一个功能，无论判成哪个都会漏答一半。工具箱里**没有**会改数据的操作（绑定 / 解绑 / 加监听仍走指令 + 确认），也没有单场复盘（它可能要等解析好几分钟，属于后台任务）。工具失败、超时、超出次数上限都只影响那一块数据或那一次调用，模型会基于已拿到的内容继续作答，不会让整条回答消失。工具调用走插件自带的模型通道（需要配置「插件专用 API Key」），没配时自动退回原本的「单轮带数据回答」，功能不受影响；另外当问题只点名了本会话里的一个人、且没有「谁 / 对比 / 大家 / 开黑」这类多人语义时，插件只会拉那个人的数据，不再把监听列表里所有人查一遍。复合问题的判定现在**规则路径与模型路径共用同一份实现**（dota_nlu.looks_composite）：此前护栏只挂在「模型没问成」才走的规则层，模型正常工作时完全不生效，于是「昨天群里谁输得最惨？给他找两个轮椅让他翻身」被模型判成「查轮椅」——前半句被静默丢掉，而且句子里没点名玩家，连轮椅都不带人；现在模型给的单个功能会被同一道护栏拦下、整条交给兜底逐项查。判据也补了一条**两步指代**：前半句用「谁 / 哪个」求一个人、后半句用「他 / 她」承接（「给他找两个轮椅」），这类句子的前半句在关键词表里不算任何意图，只看「命中几个功能族」永远抓不到，而它恰恰是最常见的复合说法。英雄池口径也在这一版重做：以前拿的是**生涯累计**，而且被数据源默认的过滤条件**静默丢掉加速模式**——OpenDota 的英雄池接口默认只统计「显著」对局，会把加速（Turbo）整批排除且不报错，于是群里九成以上打加速的人，英雄池看上去几乎是空的（实测同一个人当前版本的真实场次是 407 场，旧口径只显示 17 场，覆盖率 4%）。现在统一按**当前版本**统计（只取最新补丁），加速模式计入并在抬头写明占比（如「7.41 版本 · 407 场（加速 389 / 普通 18）」）；当前版本样本不足时会自动向前并入更早的版本，并如实说明这次覆盖了哪几个版本，不把「生涯数据」冒充「当前版本数据」；如果当前数据源本身不支持按版本过滤（例如 STRATZ 没有版本维度），会明确标注口径已退回全量，而不是假装是当前版本。也可用配置调整门槛（最少场次、最多并入几个版本、是否计入加速、是否启用版本口径）。指令 /d2 英雄、/d2 资料、/d2 轮椅 的个人推荐、AI 近期分析以及兜底对话里的英雄池查询共用同一份口径实现，同一个回答里不会再出现两种口径。这一版还把插件接进了 AstrBot 的「未来任务」：用自然语言就能建定时任务 —— 「每天早上七点，通报群里战绩情况」这类按时间的任务会落到 AstrBot 未来任务里（WebUI 可见、可控），「每监听到十盘战绩就生成一份这十盘的总结」这类按场次的任务由插件自己计数（数的是推送成功的比赛）。任务在真正建立前会先回一段确认文案（时间、周期、动作、时区都写明），回「确认」才建；`/d2 定时` 可以列出、停用、启用、删除、立刻试跑。管理已有任务也支持说人话：「取消所有定时任务」「把定时任务都删了」会把本会话的任务全部清掉，「把 2 号删掉」删单个，「把这个定时任务的执行时间改到早上八点」改执行时间（只给钟点时沿用原来的周期，把「每周五 23:00」改成「早上七点」得到的是每周五 07:00，不会偷偷变成每天都发）。因为 AstrBot 的普通任务处理器只活在内存里、重启后会丢，插件在启动与热重载时会把自己的任务按原样（名称、周期、时区、启停状态）自动认领回来，不会留下「任务显示还在、却没人执行」的哑任务；改时间与停用启用一样走「原地更新」而不是删了重建，否则任务的执行逻辑会随任务编号一起丢掉。按时间的任务时区跟随 AstrBot 全局配置，也可用配置单独指定。只有「带时间表达或每 N 场」且确实和 Dota2 数据相关的请求才会被接住（「每天七点提醒我喝水」这类一律拒绝）。
short_desc: 绑定 Dota2 玩家，查战绩、查版本强势英雄（轮椅）、AI 复盘、比赛结束自动推送赛后短评，支持按时间/按场次的定时播报（可自然语言查看、取消、改时间）；说人话即可，一句话要多个功能时会自动连查。
version: v2.3.1 # 插件版本号
