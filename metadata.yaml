name: astrbot_plugin_dota2 # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: Dota2 数据查询助手 # 用于展示的名字（需要 AstrBot >= v4.5.0）
# desc 口径固定为「一两句话：是什么 + 能做什么 + 怎么用」，约 150 字。
# 不要往这里堆功能清单——AstrBot 加载插件时会把元数据整条打进日志，
# desc 历史上曾被逐代追加到 4091 字，每次热重载都刷一屏。变更记录进 README。
desc: 基于 STRATZ + OpenDota 双数据源的 Dota2 战绩查询与 AI 分析助手：查战绩与英雄池、看版本强势英雄（轮椅）、单场深度复盘与近期打法分析，比赛结束后自动推送赛后短评。自然语言直接说人话（一句话里要好几件事会自己连着查），改绑定 / 监听 / 定时设置会先发一条确认，等你回「确认」再动手。
short_desc: 绑定 Dota2 账号即可查战绩、看版本强势英雄（轮椅）、做 AI 单场深度复盘，比赛结束还能自动推送赛后短评。直接说人话就能用，一句话里要好几件事它自己连着查。
version: v2.7.4 # 插件版本号
author: 马铭亮 # 作者
repo: https://github.com/mml-hrb/astrbot-plugin-dota2matches # 插件仓库地址
astrbot_version: ">=4.5.0"
# 平台无关：走 EventMessageType.ALL + 通用 event API，不声明即视为支持全部适配器
tags:
  - dota2
  - game
  - query
  - ai
  - data
