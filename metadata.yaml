name: astrbot_plugin_dota2 # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: Dota2 数据查询助手 # 用于展示的名字（需要 AstrBot >= v4.5.0）
desc: 基于 STRATZ + OpenDota 双数据源的 Dota2 战绩查询与 AI 分析助手：查战绩与英雄池、看版本强势英雄（轮椅）、单场深度复盘与近期打法分析，比赛结束后自动推送赛后短评。自然语言直接说人话（一句话里要好几件事会自己连着查），改绑定 / 监听 / 定时设置会先发一条确认，等你回「确认」再动手。
short_desc: 绑定 Dota2 玩家，查战绩、查版本强势英雄（轮椅）、AI 复盘、比赛结束自动推送赛后短评，支持按时间/按场次的定时播报（可自然语言查看、取消、改时间）；说人话即可 —— 一句话里要好几件事它自己连着查，要改绑定/监听/定时设置会先发一条确认，等你回「确认」再动手。闲聊走 AstrBot 的默认模型，只有比赛分析才用插件专用 Key。说人话这件事**完全交给大模型**（工具调用），不再用关键词猜意图。
version: v2.7.2 # 插件版本号
author: WorkBuddy # 作者
repo: https://github.com/AstrBotDevs/astrbot_plugin_dota2 # 插件仓库地址
astrbot_version: ">=4.5.0"
