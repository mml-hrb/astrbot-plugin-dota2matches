name: astrbot_plugin_dota2 # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: Dota2 数据查询助手 # 用于展示的名字（需要 AstrBot >= v4.5.0）
desc: 基于 STRATZ + OpenDota 双数据源的 Dota2 战绩查询与 AI 分析助手。默认以 STRATZ 为主数据源、OpenDota 为后备，主源失效时自动降级。支持绑定玩家（昵称 / 32 位 account_id / 64 位 SteamID）、战绩查询、AI 复盘分析近期打法风格、单场比赛深度复盘（走势、质量评估、十人点评）；比赛已解析时会把解析产物里的可用维度尽量喂入提示词（逐分钟经济/经验曲线、经济与经验来源分解、输出与承伤构成、英雄间伤害矩阵、视野与守卫、团战逐人贡献、技能加点与施放、道具使用、中立物品、建筑存活、翻盘/碾压指标、阵亡与复活耗时等），避免「数据拿到了却没进报告」。比赛监听改为轻量播报：比赛结束后只读取胜负与 KDA，结合该玩家近期战绩生成一段 2~4 句的短评推送，不再自动输出完整战报、不再 @ 订阅人；因为不依赖录像解析，推送也不必再等解析完成（要看完整复盘仍可用单场复盘指令）。自然语言入口默认要求消息里带唤醒词「dota2助手」，未命中时完全不介入事件传播，不影响其他插件与默认大模型；命中唤醒词但没识别出指令时，会带着本会话的监听名单、绑定关系与相关玩家的近期战绩让模型接着聊（可关闭）。AI 报告可选用插件专用的 OpenAI 兼容 API Key，与 AstrBot 全局模型解耦。
short_desc: 绑定 Dota2 玩家，查战绩、AI 复盘、比赛结束自动推送赛后短评。
version: v2.2.1 # 插件版本号
author: WorkBuddy # 作者
repo: https://github.com/AstrBotDevs/astrbot_plugin_dota2 # 插件仓库地址
astrbot_version: ">=4.5.0"
